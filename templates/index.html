<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown → Word/PDF 转换</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=8">
</head>
<body>
<div class="container">
  <header>
    <h1>Markdown 转 Word / PDF</h1>
    <p class="subtitle">支持 LaTeX 公式、Mermaid 图表、标准排版</p>
  </header>
  <div class="main">
    <div class="editor-panel">
      <textarea id="editor" placeholder="粘贴或输入 Markdown 内容...">{{ content or '' }}</textarea>
      <div class="toolbar">
        <label class="upload-btn">
          上传 .md 文件
          <input type="file" id="fileInput" accept=".md,.txt" hidden>
        </label>
        <button id="btnDocx" class="btn primary">导出 Word (.docx)</button>
        <button id="btnPdf" class="btn secondary">导出 PDF</button>
        <button id="btnSync" class="btn sync active" title="同步滚动（编辑器与预览联动）">
          <span class="sync-icon">⇅</span> 同步
        </button>
      </div>
      <div class="status-bar" id="statusBar" style="display:none"></div>
    </div>
    <div class="preview-panel">
      <div class="preview-header">
        <div class="view-toggle" id="viewToggle">
          <button class="toggle-btn active" data-view="preview">实时预览</button>
          <button class="toggle-btn" data-view="chat" id="chatToggleBtn" style="display:none">对话</button>
        </div>
        <span class="chat-title-label" id="chatTitle"></span>
      </div>
      <div id="preview"></div>
      <div class="chat-body" id="chatBody" style="display:none"></div>
    </div>
  </div>
</div>
<div class="loading-overlay" id="loadingOverlay" style="display:none">
  <div class="loading-box">
    <button id="btnCancel" class="loading-close" title="取消">×</button>
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">正在解析链接…</div>
  </div>
</div>
<a class="github-float" href="https://github.com/zmj2301/Markdown-Word-PDF" target="_blank" rel="noopener" title="View on GitHub">

</a>
<script src="{{ url_for('static', filename='app.js') }}?v=14"></script>
</body>
</html>
